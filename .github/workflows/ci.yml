# Integrazione continua di BeeWatch AI.
#
# Gira su una macchina pulita a ogni push su main e a ogni pull request: è la
# sola prova che il progetto si installa davvero da zero. Sul computer di chi
# sviluppa funziona sempre — perché lì tutto è già installato.
#
# Due job in parallelo.
#
# `qualita` (obbligatorio per il merge): tre passaggi, dal più veloce al più
# lento, così un errore banale si scopre in venti secondi invece che in tre minuti:
#   1. ruff  -> stile e import
#   2. pytest -> comportamento (senza i test `integration`)
#   3. copertura -> quanto codice è effettivamente eseguito dai test
#
# `integrazione` (M3-T6): i test `integration` con MySQL vero. Non serve un
# servizio MySQL dichiarato qui: i test avviano da soli uno stack Docker
# temporaneo con lo stesso docker-compose.yml e gli stessi script di sql/ che usa
# chi sviluppa (vedi tests/docker_support.py), e lo smontano alla fine. Così in CI
# si prova esattamente l'inizializzazione reale del database, schema, seed,
# privilegi e database di test compresi.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Se si pusha due volte di fila sullo stesso branch, la prima esecuzione viene
# annullata: non serve aspettare il risultato di un commit già superato.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualita:
    name: Lint e test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installazione del progetto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      # I test marcati `integration` girano nel job `integrazione`, qui sotto.
      - name: Test (pytest)
        run: pytest -m "not integration" --cov=beewatch --cov-report=term-missing

  integrazione:
    name: Test di integrazione (MySQL in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installazione del progetto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Versioni di Docker
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version

      # Database (M3), Docker e privilegi (Blocco 2). Se Docker non risponde i test
      # del database falliscono: un test di integrazione saltato non prova nulla.
      - name: Test di integrazione (pytest)
        run: pytest -m integration --cov=beewatch --cov-branch --cov-report=term-missing
